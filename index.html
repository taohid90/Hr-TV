    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
            authDomain: "new-all-f99f7.firebaseapp.com",
            databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
            projectId: "new-all-f99f7",
            storageBucket: "new-all-f99f7.firebasestorage.app",
            messagingSenderId: "1069748173900",
            appId: "1:1069748173900:web:158d6336c0f4628133c8e9",
            measurementId: "G-V6DZ37WSBF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ডাটাবেজ পাথ
        const DB_MATCHES = "tinoz_matches";
        const DB_CHANNELS = "tinoz_tv_channels";
        const DB_ADS = "tinoz_ads_config";
        const DB_NOTICE = "tinoz_site_notice";
        const DB_ANALYTICS = "tinoz_analytics";

        let matchesData = {}, tvData = {}, adsSettings = {};
        let selectedTvCat = 'ALL';
        let searchQuery = "";

        // ================= ট্রাফিক এবং লাইভ ভিজিটর ট্র্যাকিং সিস্টেম =================
        const uId = localStorage.getItem('hrtv_uid') || ('u_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('hrtv_uid', uId);

        const isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
        const todayStr = new Date().toISOString().split('T')[0];

        // ১. রিয়েলটাইম লাইভ অনলাইন ট্র্যাকিং (ইউজার বের হয়ে গেলে অটোমেটিক রিমুভ হবে)
        const presenceRef = db.ref(`${DB_ANALYTICS}/live_online/${uId}`);
        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                presenceRef.onDisconnect().remove();
                presenceRef.set({
                    user_id: uId,
                    joined: firebase.database.ServerValue.TIMESTAMP,
                    device: isMobile ? 'Mobile' : 'Desktop'
                });
            }
        });

        // ২. পেজ ভিউ এবং ইউনিক ভিজিটর কাউন্টার
        (function recordTrafficStats() {
            // টোটাল পেজ ভিউ বৃদ্ধি
            db.ref(`${DB_ANALYTICS}/traffic_overview/total_pageviews`).transaction(c => (c || 0) + 1);
            db.ref(`${DB_ANALYTICS}/traffic_overview/daily/${todayStr}/pageviews`).transaction(c => (c || 0) + 1);

            // দৈনিক ইউনিক ভিজিটর ট্র্যাকিং
            const visitedKey = `hrtv_visited_${todayStr}`;
            if (!localStorage.getItem(visitedKey)) {
                localStorage.setItem(visitedKey, 'true');
                db.ref(`${DB_ANALYTICS}/traffic_overview/total_unique_visitors`).transaction(c => (c || 0) + 1);
                db.ref(`${DB_ANALYTICS}/traffic_overview/daily/${todayStr}/unique_visitors`).transaction(c => (c || 0) + 1);
            }
        })();

        // ৩. PWA অ্যাপ ইনস্টল স্বয়ংক্রিয় ট্র্যাকিং
        window.addEventListener('appinstalled', () => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // অ্যাডমিন প্যানেলের জন্য ইনস্টল কাউন্টার আপডেট
            db.ref(`${DB_ANALYTICS}/traffic_overview/total_installs`).transaction(c => (c || 0) + 1);
            db.ref(`${DB_ANALYTICS}/traffic_overview/daily/${todayStr}/installs`).transaction(c => (c || 0) + 1);

            // ইনস্টল লগ সেভ
            db.ref(`${DB_ANALYTICS}/installs_log/${uId}`).set({
                user_id: uId,
                date: todayStr,
                time: timeStr,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                device: isMobile ? 'Mobile' : 'Desktop'
            });
        });

        // ================= নোটিশ ও অ্যাডস লিসেনার =================
        db.ref(DB_NOTICE).on("value", snap => {
            const val = snap.val();
            const container = document.getElementById("noticeContainer");
            const marquee = document.getElementById("mainSiteMarquee");
            if (val && val.trim()) {
                container.classList.remove("hidden");
                marquee.innerText = val;
            } else {
                container.classList.add("hidden");
            }
        });

        db.ref(DB_ADS).on("value", snap => {
            adsSettings = snap.val() || {};
            if (adsSettings.popunder_code) injectPopunder(adsSettings.popunder_code);
        });

        let popunderInjected = false;
        function injectPopunder(code) {
            if (popunderInjected || !code) return;
            popunderInjected = true;
            const container = document.createElement('div');
            container.innerHTML = code;
            Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                if (oldScript.src) newScript.src = oldScript.src;
                else newScript.textContent = oldScript.textContent;
                document.body.appendChild(newScript);
            });
        }

        // ================= ম্যাচ এবং টিভি ডাটা লোড =================
        db.ref(DB_MATCHES).on("value", snap => {
            matchesData = snap.val() || {};
            renderEvents();
        });

        db.ref(DB_CHANNELS).on("value", snap => {
            tvData = snap.val() || {};
            renderTvFilters();
            renderTvChannels();
        });

        function switchTab(tabName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

            document.getElementById(`view-${tabName}`)?.classList.add('active');
            document.getElementById(`tab-${tabName}`)?.classList.add('active');
            window.scrollTo(0, 0);
        }

        function toggleSearch(show) {
            const defH = document.getElementById("defaultHeader");
            const srcH = document.getElementById("searchHeader");
            const input = document.getElementById("searchInput");
            if (show) {
                defH.classList.add("hidden");
                srcH.classList.remove("hidden");
                input.focus();
            } else {
                srcH.classList.add("hidden");
                defH.classList.remove("hidden");
                input.value = "";
                searchQuery = "";
                renderEvents();
                renderTvChannels();
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
            renderEvents();
            renderTvChannels();
        }

        function toggleDrawer(show) {
            const drawer = document.getElementById("sideDrawer");
            const overlay = document.getElementById("drawerOverlay");
            if (show) {
                drawer.classList.remove("-translate-x-full");
                overlay.classList.remove("hidden");
            } else {
                drawer.classList.add("-translate-x-full");
                overlay.classList.add("hidden");
            }
        }

        function formatMatchTime(dateStr) {
            if (!dateStr) return "Upcoming";
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const month = d.toLocaleDateString([], { month: 'short' });
                const day = d.getDate();
                const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
                return `${month} ${day}, ${time}`;
            } catch(e) {
                return dateStr;
            }
        }

        // ================= MATCH EVENTS RENDER (Side-by-Side per Category) =================
        function renderEvents() {
            const container = document.getElementById("eventsContainer");
            container.innerHTML = "";

            const keys = Object.keys(matchesData);
            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 space-y-2">
                        <div class="w-12 h-12 rounded-2xl bg-white/5 mx-auto flex items-center justify-center text-gray-500 text-xl">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <p class="text-gray-400 text-xs font-semibold">No live events scheduled at this moment</p>
                    </div>`;
                return;
            }

            const grouped = {};
            keys.forEach(k => {
                const m = matchesData[k];
                if (searchQuery && !m.title?.toLowerCase().includes(searchQuery) && !m.team1Name?.toLowerCase().includes(searchQuery) && !m.team2Name?.toLowerCase().includes(searchQuery)) return;
                
                const cat = (m.category || "CRICKET").toUpperCase();
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({ key: k, data: m });
            });

            const catKeys = Object.keys(grouped);
            if (catKeys.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-12 text-xs">No matching events found</div>`;
                return;
            }

            catKeys.forEach(catName => {
                const matches = grouped[catName];

                let cardsHtml = '';
                matches.forEach(item => {
                    const k = item.key;
                    const m = item.data;
                    const stageTag = m.stage || m.matchType || "MATCH";
                    const isLive = m.isLive === true || m.status === 'LIVE';

                    cardsHtml += `
                        <div onclick="handleItemClick('${DB_MATCHES}', '${k}', '${m.targetUrl || ''}')" class="match-card relative rounded-3xl p-3.5 flex items-center justify-between min-w-[305px] w-[305px] h-[130px] shrink-0 cursor-pointer overflow-hidden select-none">
                            
                            <!-- Left Vertical Pill Badge -->
                            <div class="h-full w-7 rounded-2xl ${isLive ? 'vertical-badge-live' : 'vertical-badge'} flex items-center justify-center text-[10px] font-black tracking-widest text-white uppercase shrink-0 py-1 shadow-md">
                                ${isLive ? '● LIVE' : stageTag}
                            </div>

                            <!-- Match Center Area -->
                            <div class="flex-1 px-2.5 flex flex-col items-center justify-between h-full relative">
                                
                                <!-- Top Date Badge -->
                                <div class="bg-[#0b0c10]/90 border border-white/10 text-gray-200 text-[10px] font-bold px-3 py-0.5 rounded-full z-10 shadow-sm flex items-center gap-1.5">
                                    <i class="fa-regular fa-clock text-[9px] text-pink-400"></i>
                                    <span>${formatMatchTime(m.startTime)}</span>
                                </div>

                                <!-- Teams & Glowing VS -->
                                <div class="w-full flex items-center justify-between my-auto z-10">
                                    
                                    <!-- Team 1 -->
                                    <div class="flex flex-col items-center gap-1 w-5/12">
                                        <div class="w-11 h-11 rounded-full bg-white flex items-center justify-center p-1 shadow-md shadow-black/50 overflow-hidden border border-white/20">
                                            <img src="${m.team1Logo || 'https://via.placeholder.com/60'}" class="w-full h-full object-contain rounded-full" onerror="this.src='https://via.placeholder.com/60'">
                                        </div>
                                        <span class="text-xs font-bold text-gray-100 truncate max-w-[95px] text-center tracking-tight">${m.team1Name || 'Team 1'}</span>
                                    </div>

                                    <!-- Neon Glow VS Center -->
                                    <div class="w-2/12 flex items-center justify-center">
                                        <span class="vs-badge text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400 font-black text-xs px-2 py-0.5 rounded-xl tracking-wider">VS</span>
                                    </div>

                                    <!-- Team 2 -->
                                    <div class="flex flex-col items-center gap-1 w-5/12">
                                        <div class="w-11 h-11 rounded-full bg-white flex items-center justify-center p-1 shadow-md shadow-black/50 overflow-hidden border border-white/20">
                                            <img src="${m.team2Logo || 'https://via.placeholder.com/60'}" class="w-full h-full object-contain rounded-full" onerror="this.src='https://via.placeholder.com/60'">
                                        </div>
                                        <span class="text-xs font-bold text-gray-100 truncate max-w-[95px] text-center tracking-tight">${m.team2Name || 'Team 2'}</span>
                                    </div>

                                </div>
                            </div>
                        </div>`;
                });

                container.innerHTML += `
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between px-1">
                            <div>
                                <h2 class="font-extrabold text-sm tracking-wide text-white uppercase flex items-center gap-1.5">
                                    <span class="w-1.5 h-3.5 bg-gradient-to-b from-pink-500 to-purple-600 rounded-full inline-block"></span>
                                    <span>${catName}</span>
                                </h2>
                                <p class="text-[10px] text-gray-400 font-semibold pl-3">Upcoming Matches</p>
                            </div>
                        </div>
                        
                        <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 px-1 snap-x">
                            ${cardsHtml}
                        </div>
                    </div>`;
            });
        }

        // ================= LIVE TV DESIGN =================
        function renderTvFilters() {
            const filterContainer = document.getElementById("tvCatFilters");
            if (!filterContainer) return;

            const cats = new Set();
            Object.keys(tvData).forEach(k => {
                if (tvData[k].category) cats.add(tvData[k].category);
            });

            let html = `<button onclick="filterTvCat('ALL')" class="px-3.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${selectedTvCat === 'ALL' ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md shadow-pink-500/20' : 'bg-[#12131a] text-gray-400 border border-white/5'}">All Channels</button>`;
            
            cats.forEach(c => {
                html += `<button onclick="filterTvCat('${c}')" class="px-3.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${selectedTvCat === c ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md shadow-pink-500/20' : 'bg-[#12131a] text-gray-400 border border-white/5'}">${c}</button>`;
            });

            filterContainer.innerHTML = html;
        }

        function filterTvCat(cat) {
            selectedTvCat = cat;
            renderTvFilters();
            renderTvChannels();
        }

        function renderTvChannels() {
            const container = document.getElementById("tvContainer");
            container.innerHTML = "";

            const keys = Object.keys(tvData);
            if (keys.length === 0) {
                container.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-12 text-xs">No TV channels available</div>`;
                return;
            }

            let count = 0;
            keys.forEach(k => {
                const c = tvData[k];
                if (selectedTvCat !== 'ALL' && c.category !== selectedTvCat) return;
                if (searchQuery && !c.name?.toLowerCase().includes(searchQuery)) return;

                count++;
                container.innerHTML += `
                    <div onclick="handleItemClick('${DB_CHANNELS}', '${k}', '${c.targetUrl || ''}')" class="tv-channel-card p-3 rounded-2xl flex flex-col items-center justify-between cursor-pointer aspect-square relative overflow-hidden group">
                        <div class="w-12 h-12 rounded-xl bg-black/60 border border-white/10 flex items-center justify-center p-2 group-hover:scale-105 transition shadow-inner">
                            <img src="${c.logo || 'https://via.placeholder.com/80'}" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/80?text=TV'">
                        </div>
                        <div class="w-full text-center">
                            <span class="text-xs font-bold text-gray-200 truncate block group-hover:text-pink-400 transition">${c.name || 'Channel'}</span>
                            <span class="text-[9px] text-gray-500 font-semibold uppercase block mt-0.5">${c.category || 'Live'}</span>
                        </div>
                    </div>`;
            });

            if (count === 0) {
                container.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-8 text-xs">No channels in this category</div>`;
            }
        }

        // ================= CLICK HANDLER (Clicks Metric + Popunder + Stream) =================
        function handleItemClick(dbPath, key, directUrl) {
            // এডমিন প্যানেলের ক্লিকের ট্র্যাকিং
            db.ref(`${dbPath}/${key}/clicks`).transaction(c => (c || 0) + 1);

            const adUrl = adsSettings.default_ad_url || adsSettings.ad_url;
            const targetPlayer = directUrl && directUrl.startsWith('http') ? directUrl : `player.html?type=${dbPath}&id=${key}`;

            if (adUrl && adsSettings.global_enabled !== false) {
                const adWindow = window.open(adUrl, '_blank');
                if (adWindow) {
                    adWindow.blur();
                    window.focus();
                }
            }

            window.location.href = targetPlayer;
        }

        // ================= PWA APP INSTALL LOGIC =================
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            } else {
                document.getElementById("pwaModal").classList.remove("hidden");
                document.getElementById("pwaModalOverlay").classList.remove("hidden");
            }
        }

        function closePwaModal() {
            document.getElementById("pwaModal").classList.add("hidden");
            document.getElementById("pwaModalOverlay").classList.add("hidden");
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
